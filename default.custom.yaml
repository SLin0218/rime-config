customization:
  distribution_code_name: Squirrel
patch:
  schema_list:
    - schema: flypy # 添加小鹤音形
  ascii_composer/good_old_caps_lock: true
  ascii_composer/switch_key:
    Caps_Lock: noop
    Shift_L: noop
    Shift_R: noop
    Control_L: noop
    Control_R: noop
  "key_binder/bindings":
    - { accept: "Shift+space", toggle: noop, when: always} # 取消全半角切换
    - { accept: "Ctrl+j", toggle: noop, when: always} # 取消繁体切换
